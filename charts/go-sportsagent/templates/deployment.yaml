apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-sportsagent
  namespace: sportsstack
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      app: go-sportsagent
  template:
    metadata:
      labels:
        app: go-sportsagent
    spec:
      containers:
        - name: api
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: IfNotPresent
          env:
            - name: ODDSTRACKER_SERVICE_URL
              value: {{ .Values.env.oddstrackerServiceUrl | quote }}
            - name: ROTOREADER_SERVICE_URL
              value: {{ .Values.env.rotoreaderServiceUrl | quote }}
            - name: API_GATEWAY_SERVICE_URL
              value: {{ .Values.env.apiGatewayServiceUrl | quote }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: OPENAI_API_KEY
{{- if .Values.otel.enabled }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.otel.exporterEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: {{ .Values.otel.exporterProtocol | quote }}
            - name: OTEL_EXPORTER_OTLP_INSECURE
              value: {{ ternary "true" "false" .Values.otel.exporterInsecure | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: {{ .Values.otel.tracesEndpoint | quote }}
            - name: OTEL_EXPORTER_OTLP_TRACES_PROTOCOL
              value: {{ .Values.otel.tracesProtocol | quote }}
            - name: OTEL_TRACES_EXPORTER
              value: {{ .Values.otel.tracesExporter | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: {{ .Values.otel.metricsExporter | quote }}
            - name: OTEL_LOGS_EXPORTER
              value: {{ .Values.otel.logsExporter | quote }}
            - name: OTEL_PROPAGATORS
              value: {{ .Values.otel.propagators | quote }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.otel.tracesSampler | quote }}
            - name: OTEL_LOG_LEVEL
              value: {{ .Values.otel.logLevel | quote }}
{{- if .Values.otel.resourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.otel.resourceAttributes | quote }}
{{- end }}
{{- end }}
          ports:
            - containerPort: 8082
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8082
            initialDelaySeconds: 15
            periodSeconds: 20
